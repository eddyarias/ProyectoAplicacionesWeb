<form (ngSubmit)="onSubmit(userForm)" #userForm="ngForm" class="register-form">
    <div class="form-group">
      <label for="firstName">Nombre:</label>
      <input
        type="text"
        id="firstName"
        name="firstName"
        ngModel
        required
        placeholder="Ingresa tu nombre"
        class="form-control"
      />
    </div>
  
    <div class="form-group">
      <label for="lastName">Apellido:</label>
      <input
        type="text"
        id="lastName"
        name="lastName"
        ngModel
        required
        placeholder="Ingresa tu apellido"
        class="form-control"
      />
    </div>
  
    <div class="form-group">
      <label for="email">Correo Electrónico:</label>
      <input
        type="email"
        id="email"
        name="email"
        ngModel
        required
        placeholder="Ingresa tu correo electrónico"
        class="form-control"
      />
    </div>
  
    <div class="form-group">
      <label for="dob">Fecha de Nacimiento:</label>
      <input
        type="date"
        id="dob"
        name="dob"
        ngModel
        required
        class="form-control"
      />
    </div>
  
    <button type="submit" [disabled]="!userForm.valid" class="btn btn-primary">
      Registrarse
    </button>
  </form>
