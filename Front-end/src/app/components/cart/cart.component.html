<div class="container my-5">
  <h2>Carrito de Compras</h2>
  <div class="row">
    <div class="col-md-9">
      <table class="table table-borderless">
        <thead>
          <tr>
            <th>Producto</th>
            <th>Precio</th>
            <th>Cantidad</th>
            <th>Subtotal</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let item of cartItems">
            <td>
              <div class="media">
                <img [src]="'http://localhost:3600/uploads/games/' + item.portada" class="mr-3" [alt]="item.nombre" style="width: 150px;">
                <div class="media-body">
                  <h5 class="mt-0">{{ item.nombre }}</h5>
                  <p>Edición: estándar</p>
                </div>
              </div>
            </td>
            <td>{{ item.precio | currency }}</td>
            <td>
              <div class="input-group">
                <div class="input-group-prepend">
                  <button class="btn btn-outline-secondary" (click)="updateQuantity(item, -1)" type="button">-</button>
                </div>
                <input type="text" class="form-control text-center" [value]="item.cantidad" readonly>
                <div class="input-group-append">
                  <button class="btn btn-outline-secondary" (click)="updateQuantity(item, 1)" type="button">+</button>
                </div>
              </div>
            </td>
            <td>{{ (item.precio * item.cantidad) | currency }}</td>
            <td>
              <button class="btn btn-outline-danger" (click)="removeItem(item)">&times;</button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
    <div class="col-md-3">
      <div class="bg-light p-3 rounded">
        <h4>Total carrito</h4>
        <p>Subtotal <span class="float-right">{{ total | currency }}</span></p>
        <button class="btn btn-warning btn-block">Ir a pagar</button>
      </div>
    </div>
  </div>
  <div class="container text-center">
    <div class="row mt-4 justify-content-center">
      <div class="col-auto">
        <button class="btn btn-outline-secondary custom-btn" (click)="continueShopping()">Continuar comprando</button>
      </div>
      <div class="col-auto">
        <button class="btn btn-outline-danger custom-btn" (click)="clearCart()">Limpiar carrito</button>
      </div>
    </div>
  </div>
</div>
