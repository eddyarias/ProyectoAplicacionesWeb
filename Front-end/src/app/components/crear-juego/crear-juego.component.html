<form (ngSubmit)="guardarJuego(form)" #form="ngForm">
    <label for="nombre">Nombre:</label>
    <input type="text" id="nombre" [(ngModel)]="juego.nombre" name="nombre" required>
  
    <label for="descripcion">Descripción:</label>
    <input type="text" id="descripcion" [(ngModel)]="juego.descripcion" name="descripcion" required>
  
    <label for="precio">Precio:</label>
    <input type="number" id="precio" [(ngModel)]="juego.precio" name="precio" required>
  
    <label for="stock">Stock:</label>
    <input type="number" id="stock" [(ngModel)]="juego.stock" name="stock" required>
  
    <label for="sku">SKU:</label>
    <input type="number" id="sku" [(ngModel)]="juego.sku" name="sku" required>
  
    <label for="rating">Rating:</label>
    <input type="number" id="rating" [(ngModel)]="juego.rating" name="rating" required>
  
    <label for="plataforma">Plataforma:</label>
    <input type="text" id="plataforma" [(ngModel)]="juego.plataforma" name="plataforma" required>
  
    <label for="genero">Género:</label>
    <input type="text" id="genero" [(ngModel)]="juego.genero" name="genero" required>
  
    <label for="portada">Portada:</label>
    <input type="file" id="portada" (change)="imagenChangeEvent($event)" #archivoPortada>
  
    <button type="submit">Guardar Juego</button>
  </form>
  <p *ngIf="status === 'success'">Juego guardado exitosamente!</p>
  <p *ngIf="status === 'failed'">Error al guardar el juego.</p>
