<div class="crear-juego-container">
  <h2>Crear Nuevo Juego</h2>
  <form (ngSubmit)="onSubmit()">
    <div class="form-group">
      <label for="nombre">Nombre:</label>
      <input type="text" id="nombre" [(ngModel)]="game.nombre" name="nombre" required />
    </div>

    <div class="form-group">
      <label for="descripcion">Descripción:</label>
      <textarea id="descripcion" [(ngModel)]="game.descripcion" name="descripcion" required></textarea>
    </div>

    <div class="form-group">
      <label for="precio">Precio:</label>
      <input type="number" id="precio" [(ngModel)]="game.precio" name="precio" required />
    </div>

    <div class="form-group">
      <label for="stock">Stock:</label>
      <input type="number" id="stock" [(ngModel)]="game.stock" name="stock" required />
    </div>

    <div class="form-group">
      <label for="sku">SKU:</label>
      <input type="text" id="sku" [(ngModel)]="game.sku" name="sku" required />
    </div>

    <div class="form-group">
      <label for="rating">Rating:</label>
      <input type="number" id="rating" [(ngModel)]="game.rating" name="rating" required />
    </div>

    <div class="form-group">
      <label for="plataforma">Plataforma:</label>
      <input type="text" id="plataforma" [(ngModel)]="game.plataforma" name="plataforma" required />
    </div>

    <div class="form-group">
      <label for="genero">Género:</label>
      <input type="text" id="genero" [(ngModel)]="game.genero" name="genero" required />
    </div>

    <div class="form-group">
      <label for="portada">Portada del Juego:</label>
      <input type="file" (change)="onFileSelected($event)" />
    </div>

    <button type="submit" class="btn btn-primary">Crear Juego</button>
  </form>
</div>
