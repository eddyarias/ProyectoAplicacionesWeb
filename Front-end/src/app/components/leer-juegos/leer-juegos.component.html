<div class="listar-juegos-container">
  <h2>Listado de Juegos Disponibles</h2>
  <table>
    <thead>
      <tr>
        <th>Nombre</th>
        <th>Descripción</th>
        <th>Precio</th>
        <th>Stock</th>
        <th>SKU</th>
        <th>Rating</th>
        <th>Plataforma</th>
        <th>Género</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let juego of juegos">
        <td>{{ juego.nombre }}</td>
        <td>{{ juego.descripcion }}</td>
        <td>{{ juego.precio }}</td>
        <td>{{ juego.stock }}</td>
        <td>{{ juego.sku }}</td>
        <td>{{ juego.rating }}</td>
        <td>{{ juego.plataforma }}</td>
        <td>{{ juego.genero }}</td>
      </tr>
    </tbody>
  </table>
</div>
